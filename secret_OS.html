<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>🐾MiaouOS v7.3🐾</title>
  <!-- //made with Copilot & Clément 😺 -->
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Courier New', monospace;
      background: linear-gradient(to right, #1b5e20, #43a047);
      color: white;
      overflow: hidden;
    }
    #desktop {
      position: absolute;
      top: 0;
      bottom: 48px;
      left: 0;
      right: 0;
      padding: 10px;
      overflow: auto;
    }
    #taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid #ccc;
      z-index: 999;
    }
    #startBtn {
      background: #ffffff22;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    #startMenu {
      position: fixed;
      bottom: 48px;
      left: 12px;
      background: #000000dd;
      border: 1px solid #ccc;
      padding: 10px;
      display: none;
      z-index: 1000;
    }
    #startMenu button {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      margin: 6px 0;
      cursor: pointer;
      text-align: left;
    }
    #apps {
      display: flex;
      gap: 8px;
    }
    .app-icon {
      background: #ffffff33;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
    }
    #clock {
      font-size: 14px;
    }
    .window {
      position: absolute;
      top: 60px;
      left: 80px;
      width: 480px;
      height: 300px;
      background: #1e1e1e;
      border: 2px solid #ffffff33;
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      resize: both;
      overflow: hidden;
      z-index: 1001;
    }
    .window-header {
      background: #2f2f2f;
      padding: 8px;
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      border-bottom: 1px solid #444;
    }
    .window-header .controls {
      display: flex;
      gap: 4px;
    }
    .window-header button {
      background: #555;
      border: none;
      color: white;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .window-content {
      flex-grow: 1;
      padding: 10px;
      overflow: auto;
    }
    input.cmdline {
      width: 100%;
      background: black;
      color: lime;
      border: none;
      padding: 6px;
      font-family: 'Courier New';
      font-size: 14px;
    }
    #terminal {
      height: 100%;
      overflow-y: auto;
      font-size: 14px;
      color: lime;
    }
    #terminal div {
      margin-bottom: 4px;
    }
    .folder {
      font-weight: bold;
      margin-top: 10px;
    }
    .file {
      margin: 4px 0;
      cursor: pointer;
    }
    .file:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="desktop"></div>
  <div id="startMenu">
    <button onclick="openExplorer()">📁 Explorateur GitHub</button>
    <button onclick="openBrowser('index.html')">🌐 Navigateur</button>
    <button onclick="openSettings()">⚙️ Paramètres</button>
    <button onclick="openChat()">😺 Chat Royal</button>
    <button onclick="clearDesktop()">🧹 Tout fermer</button>
  </div>
  <div id="taskbar">
    <div id="startBtn">🟢 Miaou</div>
    <div id="apps"></div>
    <div id="clock"></div>
  </div>
  <script>
    // 🐾 Made with Copilot & Clément
    const desktop = document.getElementById("desktop");
    const apps = document.getElementById("apps");
    const startMenu = document.getElementById("startMenu");

    document.getElementById("startBtn").onclick = () =>
      startMenu.style.display = startMenu.style.display === "none" ? "block" : "none";

    setInterval(() => {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString();
    }, 1000);

    function clearDesktop() {
      desktop.innerHTML = "";
      apps.innerHTML = "";
      startMenu.style.display = "none";
    }

    function addApp(name, id) {
      const icon = document.createElement("div");
      icon.className = "app-icon";
      icon.id = "icon-" + id;
      icon.textContent = name;
      apps.appendChild(icon);
    }

    function createWindow(title, contentHTML) {
      const winID = "app-" + Date.now();
      const win = document.createElement("div");
      win.className = "window";
      win.id = winID;
      win.innerHTML = `
        <div class="window-header" onmousedown="dragStart(event, this.parentElement)">
          ${title}
          <div class="controls">
            <button onclick="toggleFullscreen(this)">🗖</button>
            <button onclick="document.getElementById('${winID}').remove(); document.getElementById('icon-${winID}').remove();">✖</button>
          </div>
        </div>
        <div class="window-content">${contentHTML}</div>`;
      desktop.appendChild(win);
      addApp(title, winID);
      startMenu.style.display = "none";
    }

    function toggleFullscreen(btn) {
      const win = btn.closest(".window");
      if (win.dataset.full === "true") {
        win.style.position = "absolute";
        win.style.top = "60px";
        win.style.left = "80px";
        win.style.width = "480px";
        win.style.height = "300px";
        win.dataset.full = "false";
      } else {
        win.style.position = "fixed";
        win.style.top = "0";
        win.style.left = "0";
        win.style.width = "100vw";
        win.style.height = "calc(100vh - 48px)";
        win.dataset.full = "true";
      }
    }

    let offsetX, offsetY;
    function dragStart(e, win) {
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;
      document.onmousemove = (e) => {
        win.style.left = e.clientX - offsetX + "px";
        win.style.top = e.clientY - offsetY + "px";
      };
      document.onmouseup = () => document.onmousemove = null;
    }
    // 📁 Explorateur GitHub
    function openExplorer() {
      const structure = `
        <div class='folder'>Ahomine_/</div>
        <div class='file' onclick="openBrowser('index.html')">📄 index.html</div>
        <div class='file' onclick="openBrowser('liens.html')">📄 liens.html</div>
        <div class='file' onclick="openBrowser('projet.html')">📄 projet.html</div>
        <div class='file' onclick="openBrowser('secret_OS.html')">📄 secret_OS.htm</div>
        <div class='file' onclick="openBrowser('style.css')">🎨 style.css</div>
        <div class='file' onclick="openBrowser('download.html')">📄 download.html</div>
        <div class='file' onclick="openBrowser('test.txt')">📄 test.txt</div>
        <div class='file' onclick="openBrowser('README.md')">📄 README.md</div>
        <div class='file' onclick="openBrowser('404.html')">📄 404.html</div>
        <div class='folder'>jeu/</div>
        <div class='file' onclick="openBrowser('jeu/jeu1.html')">📄 jeu1.html</div>
        <div class='folder'>image/</div>
        <div class='file' onclick="openBrowser('image/Ahomine_.png')">📷 Ahomine_.png</div>
      `;
      createWindow("📁 Explorateur GitHub", structure);
    }

    // 🌐 Navigateur intégré
    function openBrowser(file) {
      const url = `https://ahomine-off.github.io/Ahomine_/${file}`;
      const viewer = `<iframe src="${url}"></iframe>`;
      createWindow(`🌐 ${file}`, viewer);
    }

    // ⚙️ Paramètres
    function openSettings() {
      const html = `
        <label><input type="checkbox" onchange="toggleCookies(this)"> Activer les cookies</label>
        <p id="cookieStatus"></p>`;
      createWindow("⚙️ Paramètres", html);
      updateCookieUI();
    }

    function toggleCookies(el) {
      localStorage.setItem("cookiesEnabled", el.checked ? "true" : "false");
      updateCookieUI();
    }

    function updateCookieUI() {
      const status = localStorage.getItem("cookiesEnabled") === "true";
      const el = document.getElementById("cookieStatus");
      if (el) el.textContent = status ? "🍪 Cookies activés." : "🚫 Cookies désactivés.";
    }

    // 😺 Chat Royal
    function openChat() {
      const html = `
        <div style="text-align:center;font-size:80px;animation:bounce 1s infinite;">😺</div>
        <style>
          @keyframes bounce {
            0% {transform: translateY(0);}
            50% {transform: translateY(-10px);}
            100% {transform: translateY(0);}
          }
        </style>
        <p style="text-align:center;">Bienvenue dans le chat royal de MiaouOS.</p>`;
      createWindow("😺 Chat Royal", html);
    }

    // 💻 MiaouShell Terminal
    function openCmd() {
      const html = `
        <div id="terminal">
          <div>MiaouShell [v1.0] – tapez 'help' pour commencer</div>
        </div>
        <input class="cmdline" placeholder="> Tape une commande ici…" onkeydown="runCmd(event)">
      `;
      createWindow("💻 Terminal MiaouShell", html);
    }

    function runCmd(e) {
      if (e.key === "Enter") {
        const input = e.target;
        const cmd = input.value.trim();
        const terminal = input.previousElementSibling;
        const out = document.createElement("div");
        out.textContent = "> " + cmd;
        terminal.appendChild(out);

        const res = document.createElement("div");
        switch (cmd.toLowerCase()) {
          case "help": res.textContent = "Commandes : help, ip, echo [texte], exit"; break;
          case "ip": res.textContent = "Ton IP est : 88.173.22.29"; break;
          case "exit": input.closest(".window").remove(); break;
          default:
            if (cmd.startsWith("echo ")) res.textContent = cmd.slice(5);
            else res.textContent = "Commande inconnue : " + cmd;
        }
        terminal.appendChild(res);
        terminal.scrollTop = terminal.scrollHeight;
        input.value = "";
      }
    }
  </script>
</body>
</html>
